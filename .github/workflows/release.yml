name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kuon-org/kuon

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate and resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}"
            echo "Release tags must use the vX.Y.Z format."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          MINOR="${VERSION%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate

      - name: Build client
        run: pnpm --filter client build

      - name: Build server
        run: pnpm --filter server build

      - name: Copy client build into server runtime
        run: cp -r client/dist/. server/dist/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: server
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ steps.version.outputs.version }}" \
            -t "${IMAGE_NAME}:${{ steps.version.outputs.minor }}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Push Docker images
        run: |
          docker push "${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          docker push "${IMAGE_NAME}:${{ steps.version.outputs.minor }}"
          docker push "${IMAGE_NAME}:latest"

      - name: Checkout kuon-docker-compose
        uses: actions/checkout@v5
        with:
          repository: kuon-org/kuon-docker-compose
          ref: main
          token: ${{ secrets.KUON_COMPOSE_PAT }}
          path: kuon-docker-compose

      - name: Sync initial database schema
        run: |
          mkdir -p kuon-docker-compose/database/migrations/docker-entrypoint-initdb.d
          cp database/migrations/docker-entrypoint-initdb.d/init_schema.sql \
            kuon-docker-compose/database/migrations/docker-entrypoint-initdb.d/init_schema.sql

      - name: Commit synchronized schema
        working-directory: kuon-docker-compose
        env:
          SOURCE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/migrations/docker-entrypoint-initdb.d/init_schema.sql
          if git diff --cached --quiet; then
            echo "Initial database schema is already up to date."
            exit 0
          fi
          git commit \
            -m "chore: sync initial schema for ${SOURCE_TAG}" \
            -m "Source: kuon-org/kuon@${SOURCE_TAG}"
          git push origin HEAD:main
