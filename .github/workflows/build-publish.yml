name: Build and Publish

on:
  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: true
        type: choice
        default: develop
        options:
          - develop
          - latest

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'develop' }}

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ========================================
      # Checks                                    Temporarily comment out
      # ========================================
      # - name: Lint client
      #   run: pnpm --filter client lint

      # - name: Typecheck
      #   run: pnpm typecheck

      # ========================================
      # Build client
      # ========================================
      - name: Build client
        run: pnpm --filter client build

      # ========================================
      # Build server
      # ========================================
      - name: Build server
        run: pnpm --filter server build

      # The server serves the SPA from server/dist, so merge the client
      # build into the same runtime directory after the server build.
      - name: Copy client build into server runtime
        run: |
          cp -r client/dist/. server/dist/

      # Prisma Client is generated by the server Dockerfile inside the
      # runtime image. Nothing from the workspace node_modules is copied.

      # ========================================
      # Login to GitHub Container Registry
      # ========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # Build Docker image
      # ========================================
      - name: Build Docker image
        working-directory: server
        run: |
          docker build \
            -t ghcr.io/hiroppe0409/kuon:${IMAGE_TAG} \
            .

      # ========================================
      # Publish Docker image
      # ========================================
      - name: Push Docker image
        run: |
          docker push ghcr.io/hiroppe0409/kuon:${IMAGE_TAG}
