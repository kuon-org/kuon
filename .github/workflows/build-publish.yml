name: Build and Publish Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kuon-org/kuon

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ========================================
      # Checks                                    Temporarily comment out
      # ========================================
      # - name: Lint client
      #   run: pnpm --filter client lint

      # - name: Typecheck
      #   run: pnpm typecheck

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate

      - name: Build client
        run: pnpm --filter client build

      - name: Build server
        run: pnpm --filter server build

      - name: Copy client build into server runtime
        run: cp -r client/dist/. server/dist/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: server
        run: docker build -t "${IMAGE_NAME}:develop" .

      - name: Push Docker image
        run: docker push "${IMAGE_NAME}:develop"
