name: Build and Publish

on:
  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: true
        type: choice
        default: develop
        options:
          - develop
          - latest

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'develop' }}

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # Checkout develop
      # ========================================
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      # ========================================
      # Setup Node.js
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ========================================
      # Build client
      # ========================================
      - name: Install client dependencies
        working-directory: develop/client
        run: npm ci

      - name: Build client
        working-directory: develop/client
        run: npm run build

      # ========================================
      # Checkout app branch
      # ========================================
      - name: Checkout app branch
        uses: actions/checkout@v4
        with:
          ref: app
          path: app

      # ========================================
      # Copy server source
      #
      # app/server/src/index.ts is production-specific,
      # so keep it and copy everything else from develop.
      # ========================================
      - name: Sync server source
        run: |
          rsync -av \
            --exclude='index.ts' \
            develop/server/src/ \
            app/server/src/

      # ========================================
      # Copy client build
      # ========================================
      - name: Sync client build
        run: |
          rm -rf app/server/dist
          cp -r develop/client/dist app/server/dist

      # ========================================
      # Build server
      # ========================================
      - name: Install server dependencies
        working-directory: app/server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: app/server
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Build server
        working-directory: app/server
        run: npm run build

      # ========================================
      # Login to GitHub Container Registry
      # ========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # Build Docker image
      # ========================================
      - name: Build Docker image
        working-directory: app/server
        run: |
          docker build \
            -t ghcr.io/hiroppe0409/kuon:${IMAGE_TAG} \
            .

      # ========================================
      # Publish Docker image
      # ========================================
      - name: Push Docker image
        run: |
          docker push ghcr.io/hiroppe0409/kuon:${IMAGE_TAG}
