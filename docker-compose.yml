services:
  db:
    image: postgres:18
    container_name: ${APP}-postgres
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      PRJ_DB_NAME: ${PRJ_DB_NAME}
      TZ: "Asia/Tokyo"
    volumes:
      - db-data:/var/lib/postgresql
      - ./database/migrations/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT}:${DB_PORT}"

  kuon-app:
    image: ghcr.io/hiroppe0409/kuon:latest   # ← ★ ここに差し替え！
    container_name: ${APP}-server
    env_file:
      - ./.env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - db
    volumes:
      - ./server/public/uploads:/app/public/uploads

volumes:
  db-data:
    name: ${DB_DATA_VOLUME}