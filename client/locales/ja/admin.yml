  testTo: 送信先メールアドレス
  testSend: テスト送信

security:
  title: 認証・セキュリティ
  description: ローカル認証、外部Identity Provider、2FAなど認証に関する設定を管理します。
  identityProviders: Identity Providers
  accessControl:
    title: アクセス制御
    description: 未ログインユーザーによる記事・タグ・ユーザー情報などの閲覧を制御します。
    requireLogin: ログインを要求する
    allowPublic: 公開アクセスを許可する
  localAccount:
    title: ID / Password
    registrationTitle: ローカルアカウントの新規登録
    registrationDescription: 無効にすると、新しいローカルアカウントを作成できなくなります。既存アカウントのログインや外部IdP認証には影響しません。
    disabledWarning: 新しいユーザーは外部IdP経由でのみ作成できます。ユーザーが1人も存在しない初期セットアップ時は、この設定に関係なく登録できます。
    verificationTitle: Email Verification
    verificationDescription: Requiredにすると、新しく作成したローカルアカウントは確認メールのURLを開くまでログインできません。
    verificationRequired: 現在Requiredです。確認メールの送信にはアプリ設定内のSMTP設定を利用します。
  twoFactor:
    title: 2FA / Security Policy
    description: OIDC / OAuth2 / SAMLで認証した場合でも、Kuon側でTOTPを有効にしているユーザーへ追加の二段階認証を要求できます。
    require: 要求する
    notRequire: 要求しない
  apiKey:
    title: API Key
    description: API Keyの発行と、発行済みAPI Keyによる認証を許可します。

