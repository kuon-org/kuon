serverSettings:
  title: アプリ設定
  description: Kuonインスタンス全体の運用・通知・外部連携に関する設定を管理します。
  updateFailed: 設定の更新に失敗しました
  envReadOnly: "Source: Environment — 環境変数から設定されているため読み取り専用です。"
  maintenance:
    title: メンテナンスモード
    description: 有効にすると、一般ユーザーからのコンテンツアクセスを停止します。管理者は引き続き管理画面へアクセスして解除できます。
    warning: 現在メンテナンスモードです。一般ユーザーにはメンテナンス画面が表示されます。
  notifications:
    title: アプリ内通知
    description: インスタンス全体でアプリ内通知を有効にします。無効の場合、新しい通知は生成されず、TopBarの通知ベルも表示されません。
  webhooks:
    title: Webhook
    description: インスタンス全体でWebhook配信を許可します。無効の場合、登録済みWebhookが有効でも外部への通知は送信されません。
    userTitle: ユーザーWebhook
    userDescription: ユーザー単位のWebhook登録・配信を許可します。外部URLへの情報送信経路になるため、必要な場合のみ有効にしてください。

backup:
  title: Backup & Restore
  description: Kuonのデータベースとアップロード済みファイルを、移行・障害復旧用のバックアップとして保存・復元できます。
  exportFailed: バックアップの作成に失敗しました。サーバログを確認してください。
  backupTitle: Backup
  backupDescription: PostgreSQLの論理バックアップ、uploads、manifestを1つのtar.gzとしてダウンロードします。.envやインフラ固有のSecretは含まれません。
  maintenanceHint: DBとuploadsの更新を完全に止めて取得したい場合は、先にメンテナンスモードを有効にしてください。
  creating: バックアップ作成中...
  create: バックアップを作成
  restoreTitle: Restore
  restoreWarning: 現在のデータベースとアップロード済みファイルをバックアップ時点へ置き換えます。完了後は全セッションが無効化され、メンテナンスモードが有効になります。
  restoreDescription: .env、DATABASE_URL、JWT Secret、Reverse Proxy等のインフラ設定は復元対象外です。
  chooseFile: バックアップファイルを選択
  restore: 復元する
  restoreConfirmTitle: バックアップから復元しますか？
  restoreConfirmDescription: 実行前に現在のDBを一時退避し、失敗時は可能な限り元へ戻します。続行するには RESTORE と入力してください。
  restoring: 復元中...
  executeRestore: 復元を実行
  restoreFailed: 復元に失敗しました。サーバログを確認してください。

