serverSettings:
  title: Application settings
  description: Manage instance-wide operational, notification, and integration settings.
  updateFailed: Failed to update settings
  envReadOnly: "Source: Environment — This setting is read-only because it is configured through environment variables."
  maintenance:
    title: Maintenance mode
    description: When enabled, content access for regular users is suspended. Administrators can continue to access the admin console and disable maintenance mode.
    warning: Maintenance mode is currently enabled. Regular users will see the maintenance page.
  notifications:
    title: In-app notifications
    description: Enable in-app notifications for the entire instance. When disabled, new notifications are not generated and the notification bell is hidden from the top bar.
  webhooks:
    title: Webhooks
    description: Allow webhook delivery across the instance. When disabled, no external notifications are sent even if individual webhooks are enabled.
    userTitle: User webhooks
    userDescription: Allow users to register and deliver their own webhooks. Enable this only when needed because it creates a path for sending information to external URLs.

backup:
  title: Backup & Restore
  description: Back up and restore the Kuon database and uploaded files for migration and disaster recovery.
  exportFailed: Failed to create the backup. Check the server logs.
  backupTitle: Backup
  backupDescription: Downloads a PostgreSQL logical backup, uploads, and manifest as a single tar.gz file. Infrastructure-specific secrets and .env are not included.
  maintenanceHint: Enable maintenance mode first if you need to completely stop database and upload changes while creating the backup.
  creating: Creating backup...
  create: Create backup
  restoreTitle: Restore
  restoreWarning: This replaces the current database and uploaded files with the state from the backup. All sessions are invalidated and maintenance mode is enabled after completion.
  restoreDescription: Infrastructure settings such as .env, DATABASE_URL, JWT secrets, and reverse proxy configuration are not restored.
  chooseFile: Choose backup file
  restore: Restore
  restoreConfirmTitle: Restore from this backup?
  restoreConfirmDescription: The current database is temporarily preserved before restoring and will be recovered when possible if the restore fails. Type RESTORE to continue.
  restoring: Restoring...
  executeRestore: Restore now
  restoreFailed: Restore failed. Check the server logs.

